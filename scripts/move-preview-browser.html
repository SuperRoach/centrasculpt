<!doctype html><html><head><meta charset="utf-8"><title>Phase 2.0 Move preview validation</title><style>body{margin:0;background:#20282c;color:#e8f2ef;font:15px system-ui}header{padding:16px 24px}h1{font-size:21px;margin:0 0 8px}button,select{font:inherit;padding:8px 14px;margin:8px 4px 0 0;background:#e5efe8;border:0;border-radius:5px;color:#182e28}button:disabled{opacity:.4}#view{height:520px;position:relative}canvas{width:100%;height:100%;display:block}.labels{display:flex;position:absolute;top:15px;left:0;right:0;justify-content:space-around;pointer-events:none;font-weight:600}output{display:block;padding:12px 24px;font:14px monospace}p{margin:4px 0;color:#bbcfca}</style></head><body><header><h1>MOVE · EXPERIMENTAL PREVIEW ONLY</h1><p>Left: authoritative baseline. Right: temporary radial preview. Release restores the original SDF surface; no undo action.</p><button id="start">Grab surface</button><button id="pull" disabled>Pull region</button><button id="long" disabled>Long pull · full travel</button><button id="release" disabled>Release / restore</button><button id="cancel">Cancel / tracking loss</button><label>Influence <select id="radius"><option>.2</option><option>.3</option><option selected>.5</option></select></label></header><div id="view"><div class="labels"><span>Authoritative baseline</span><span id="label">Move source · unchanged</span></div></div><output id="state">Starting WebGL…</output><output id="checks">Checking source invariants…</output><script type="module">

const settings={mode:'add',radius:.22,strength:.35,hardness:.5,camera:{position:[2,2,3],target:[0,0,0]}},layers=new IndependentLayers(createBaseProject(new SDFVolume(64),settings)),shape=new ShapePreviewModel(layers.project.activeLayerId),tools=new EditorToolState({layers:()=>layers,shape,settings:()=>settings,setSettings(){},mode:()=> 'sculpt',selectTool(){},selectTransform(){},busy:()=>false,changed(){}});tools.select('move');tools.move.mode='preview';tools.move.radius=.5;tools.move.falloff=1;
const scene=new THREE.Scene();scene.background=new THREE.Color('#85888a');const root=new THREE.Group();scene.add(root,layers.group);layers.group.position.x=1.1;const baseline=layers.exportGroup();baseline.position.x=-1.1;scene.add(baseline);scene.add(new THREE.HemisphereLight(0xffffff,0x44484a,2));const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(-1,4,5);scene.add(light);
const move=new XRMoveTool(()=>layers,tools,root),controller={role:'tool',connected:true,tracked:true,gripTracked:true,connectionId:1,buttons:{trigger:{pressed:false,rawValue:0,justPressed:false},grip:{pressed:false,rawValue:0}}},aim=new THREE.Matrix4().makeTranslation(1.1,0,2),grip=aim.clone(),view=document.querySelector('#view'),state=document.querySelector('#state'),checks=document.querySelector('#checks'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));view.append(renderer.domElement);let shaderError=false;renderer.debug.onShaderError=(gl,program,vs,fs)=>{shaderError=true;checks.textContent='SHADER ERROR: '+gl.getShaderInfoLog(vs)+' '+gl.getShaderInfoLog(fs);};

const before=new Uint8Array(saveSculptProject(layers.project)),source=layers.active.volume;function verify(){if(shaderError)return;const after=new Uint8Array(saveSculptProject(layers.project)),same=before.length===after.length&&before.every((v,i)=>v===after[i]);checks.textContent=`${same?'PASS':'FAIL'} · source/native bytes unchanged · history ${layers.undoCount} undo / ${layers.redoCount} redo · allocation unchanged ${layers.active.volume===source} · shader ${shaderError?'FAILED':'no compile errors reported'}`;}
function update(){move.update(controller,aim,performance.now(),true,grip);controller.buttons.trigger.justPressed=false;document.querySelector('#start').disabled=move.active;document.querySelector('#pull').disabled=!move.active;document.querySelector('#release').disabled=!move.active;document.querySelector('#long').disabled=!move.active;document.querySelector('#radius').disabled=move.active;document.querySelector('#label').textContent=move.active?'Live Move · PREVIEW ONLY':'Move source · unchanged';}
document.querySelector('#start').onclick=()=>{controller.buttons.trigger={pressed:true,rawValue:1,justPressed:true};update();verify();};document.querySelector('#pull').onclick=()=>{grip.makeTranslation(1.25,.08,2.15);update();verify();};document.querySelector('#long').onclick=()=>{grip.makeTranslation(1.8,.2,3.5);update();verify();};document.querySelector('#release').onclick=()=>{controller.buttons.trigger={pressed:false,rawValue:0,justPressed:false};update();grip.copy(aim);verify();};document.querySelector('#cancel').onclick=()=>{controller.tracked=false;update();controller.tracked=true;controller.buttons.trigger={pressed:false,rawValue:0,justPressed:false};grip.copy(aim);verify();};document.querySelector('#radius').onchange=e=>{tools.move.radius=Number(e.target.value);};let last=0;renderer.setAnimationLoop(time=>{update();renderer.render(scene,camera);if(time-last>150){last=time;state.textContent=`${move.feedback} | ${move.preview.affectedVertices} affected / ${move.preview.candidateVertices} candidate vertices · ${move.preview.affectedChunks} chunks · update CPU ${move.lastMs.toFixed(3)} ms`;}});verify();window.addEventListener('beforeunload',()=>{move.dispose();layers.dispose();baseline.traverse(o=>o.geometry?.dispose());renderer.dispose();});
