<!doctype html><html><head><meta charset="utf-8"><title>Move precision validation</title><style>body{margin:0;background:#242b2d;color:#eaf2ee;font:15px system-ui}header{padding:18px 24px}h1{font-size:22px;margin:0 0 8px}button{padding:10px;margin:6px 4px 0 0;font:inherit}#view{height:450px;position:relative}canvas{display:block}output{display:block;padding:10px 24px;font:13px monospace}.labels{display:flex;position:absolute;left:0;right:0;top:10px;justify-content:space-around;pointer-events:none}p{margin:6px 0}</style></head><body><header><h1>Move · precision and wrist validation</h1><p>Left: original reference. Right: editable source. Hold/pull previews; release reconstructs and commits one Undo action.</p><p><label>Gesture <select id="gesture"><option value="free">Free Move</option><option value="translate">Translate</option><option value="rotate">Rotate region</option><option value="twist">Twist region</option></select></label> <label>Placement <select id="placement"><option value="surface">Surface</option><option value="free">Free at controller tip</option></select></label> <label>Feel <select id="feel"><option value="non-elastic">Non-Elastic</option><option value="elastic">Elastic</option></select></label> <button id="precision">Precision off</button> <button id="lock">Lock / unlock target</button></p><button id="small" disabled>1 mm adjustment</button><button id="turn" disabled>Turn wrist 170°</button><button id="beyond" disabled>Turn wrist 190°</button><button id="grab">Grab surface</button><button id="pull" disabled>Pull region</button><button id="combined" disabled>Pull and turn wrist</button><button id="larger" disabled>Grow live radius</button><button id="tracking" disabled>Lose tracking</button><button id="long" disabled>Long pull / growth</button><button id="commit" disabled>Release / commit</button><button id="cancel">Cancel</button><button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><button id="verify">Verify native/source
