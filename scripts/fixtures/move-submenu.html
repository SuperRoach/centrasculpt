<!doctype html><html lang="en"><meta charset="utf-8"><title>Centra Sculpt · Move variants</title><style>body{margin:0;background:#263039;color:#edf5f1;font:16px system-ui}header{padding:18px}button,select{font:inherit;padding:10px;border-radius:8px;margin:4px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}.stage{background:#808080;border-radius:16px;overflow:hidden}.stage.ar{background:repeating-conic-gradient(#d4d8d2 0% 25%,#8ba49d 0% 50%) 0/50px 50px}canvas{display:block;width:100%}h2{font-size:17px;background:#17242c;padding:10px;margin:0}output{display:block;margin:10px} @media(max-width:900px){main{grid-template-columns:1fr}}</style>
<header><h1>Move · original engines, simpler VR menus</h1><label>Environment <select id="environment"><option>Studio</option><option>Passthrough preview</option></select></label><label>Variant <select id="variant"></select></label><button id="recall">Clay → recall Move</button><button id="next">Next settings page</button><output id="status"></output></header>
<main><section class="stage"><h2>Main wheel · nine tools</h2><div id="wheel"></div></section><section class="stage"><h2>Move variants</h2><div id="variants"></div></section><section class="stage"><h2>Selected variant settings</h2><div id="settings"></div></section></main>
<script type="module">
import {XRMenuModel} from '/src/xr-menu-model.ts';import {XRMenuView} from '/src/xr-menu-view.ts';import {EditorToolState,MOVE_VARIANT_LABELS} from '/src/editor-tool-state.ts';import {MOVE_VARIANTS} from '/src/tool-preferences.ts';import {IndependentLayers} from '/src/independent-layers.ts';import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';
const initial={mode:'add',radius:.22,strength:.35,hardness:.1,camera:{position:[2,2,3],target:[0,0,0]}},layers=new IndependentLayers(createBaseProject(new SDFVolume(33),initial)),shape=new ShapePreviewModel(layers.project.activeLayerId);let state={...initial},mode='sculpt',clock=0;const tools=new EditorToolState({layers:()=>layers,shape,settings:()=>state,setSettings:v=>state=v,mode:()=>mode,selectTool:t=>{shape.setEnabled(t==='stamp',layers.project.layerStack);mode=t==='transform'?'translate':'sculpt';if(t==='clay'||t==='smooth')state={...state,mode:t==='clay'?'add':'smooth'};},selectTransform:m=>mode=m,busy:()=>false,changed(){}});tools.selectMoveGroup();
const views={};for(const id of ['wheel','variants','settings']){const model=new XRMenuModel(tools),view=new XRMenuView(model);view.place({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});model.setRequest(id==='wheel'?'tool-wheel':'tool-options');document.querySelector('#'+id).append(view.canvas);views[id]={model,view};view.canvas.onclick=e=>{const r=view.canvas.getBoundingClientRect(),hit=model.hit((e.clientX-r.left)*1152/r.width,(e.clientY-r.top)*1152/r.height);if(hit){model.activate(hit);if(id==='wheel')model.page='tool-wheel';document.querySelector('#variant').value=tools.lastMoveVariant;paint();}};}
function paint(){for(const [id,{model,view}]of Object.entries(views)){if(id==='variants'){model.page='tool-options';if(tools.moveFamily&&model.content().buttons.some(b=>b.id==='move-variants'))model.activate('move-variants');}view.update(id==='wheel'?'tool-wheel':'tool-options',undefined,undefined,clock+=200,true);}document.querySelector('#status').textContent=`${tools.contextLabel} · engine ${tools.active} · ${layers.undoCount} Undo / ${layers.redoCount} Redo · host canvas preview, physical Quest pending`;}
const select=document.querySelector('#variant');for(const variant of MOVE_VARIANTS){const o=document.createElement('option');o.value=variant;o.textContent=MOVE_VARIANT_LABELS[variant];select.append(o);}select.onchange=()=>{tools.selectMoveVariant(select.value);views.settings.model.optionPage=0;paint();};document.querySelector('#recall').onclick=()=>{tools.select('clay');tools.selectMoveGroup();paint();};document.querySelector('#next').onclick=()=>{views.settings.model.activate('next');paint();};document.querySelector('#environment').onchange=e=>{for(const s of document.querySelectorAll('.stage'))s.classList.toggle('ar',e.target.value!=='Studio');paint();};paint();
</script></html>
