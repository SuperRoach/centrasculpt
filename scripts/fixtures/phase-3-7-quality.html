<!doctype html><meta charset="utf-8"><title>Phase 3.7 resolution acceptance</title>
<style>body{margin:0;background:#303a3d;color:white;font:14px system-ui}h1,p{margin:12px 16px}main{display:grid;grid-template-columns:repeat(3,420px);gap:2px}.tile{position:relative}.tile span{position:absolute;bottom:8px;left:10px;color:#182c33}canvas{display:block}</style>
<h1>Current Clay · 64³ / 128³ / 192³</h1><p>Same radius .065, stroke, camera, neutral material and fixed lights. Top: lit geometry. Bottom: identical geometry, unlit silhouette.<br>Desktop WebGL inspection fixture; no subdivision, lighting editor or headset quality claim.</p><main></main>
<script type="module">
import * as T from 'three';
import {SDFVolume} from '/work/test-build/sdf.mjs';
import {ClayStroke} from '/work/test-build/stroke.mjs';
import {IncrementalMesher} from '/work/test-build/mesh.mjs';
for(const silhouette of [false,true])for(const n of [64,128,192]){
 const v=new SDFVolume(n,1.6,false);v.values.fill(6.4);const stroke=new ClayStroke();
 for(let i=0;i<=15;i++)stroke.apply(v,{x:-.55+1.1*i/15,y:.013,z:.019},.065,'add',.35,1/90,undefined,.6,undefined,true);
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(420,220);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;
 const scene=new T.Scene();scene.background=new T.Color('#e9e9e3');scene.add(new T.HemisphereLight(0xffffff,0x687267,2.7));
 for(const [color,intensity,position] of [[0xfff4df,3.4,[-3,5,4]],[0xd6eaff,1.4,[4,1,-2]]]){const light=new T.DirectionalLight(color,intensity);light.position.set(...position);scene.add(light);}
 const camera=new T.PerspectiveCamera(38,420/220,.01,10);camera.position.set(.3,.22,1.8);camera.lookAt(0,0,0);
 const material=silhouette?new T.MeshBasicMaterial({color:'#182c33'}):new T.MeshStandardMaterial({color:'#86aeb8',roughness:.68,metalness:.03});
 const mesher=new IncrementalMesher(v,16);for(const u of mesher.rebuildChunks().updates)if(u.geometry.getAttribute('position').count)scene.add(new T.Mesh(u.geometry,material));
 const tile=document.createElement('div');tile.className='tile';const label=document.createElement('span');label.textContent=`${n}³ · radius ${( .065/v.step).toFixed(2)} voxels · ${silhouette?'silhouette':'fixed lighting'}`;tile.append(renderer.domElement,label);document.querySelector('main').append(tile);renderer.render(scene,camera);
}
document.body.dataset.ready='true';
</script>
