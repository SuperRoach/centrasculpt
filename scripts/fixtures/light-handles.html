<!doctype html><html><head><meta charset="utf-8"><title>Studio light handles</title><style>body{margin:20px;background:#18252a;color:#eef6ef;font:16px system-ui}button{font:inherit;padding:10px;margin:5px;border-radius:8px}canvas{max-width:100%;display:block}output{display:block;margin:12px 0}</style></head><body><h1>Studio light handles</h1><p>Key and Rim: open barn doors. Fill: off, doors shut. Front panels point along the beam.</p><button id="rotate">Move and rotate Key with a simulated grip</button><button id="fill">Toggle Fill light</button><button id="reset">Reset pose</button><div id="stage"></div><output id="status"></output><output id="errors">No shader errors</output><script type="module">
import {Scene,Group,PerspectiveCamera,WebGLRenderer,DirectionalLight,HemisphereLight,Color,Matrix4} from 'three';import {LightRig} from '/src/light-rig.ts';import {defaultLighting} from '/src/lighting.ts';
const scene=new Scene(),root=new Group(),camera=new PerspectiveCamera(40,1.7,.01,20),renderer=new WebGLRenderer({alpha:true,antialias:true}),key=new DirectionalLight(),fill=new DirectionalLight(),ambient=new HemisphereLight();scene.add(root,key,fill,ambient);scene.background=new Color('#263b43');renderer.setSize(850,500);document.querySelector('#stage').append(renderer.domElement);camera.position.set(.25,.32,-1.6);camera.lookAt(0,0,0);let config=defaultLighting();const rig=new LightRig(()=>config,root,key,fill,ambient);
function reset(){config=defaultLighting();config.enabled=true;Object.entries(config.lights).forEach(([id,l],i)=>{l.position=[(i-1)*.4,0,0];l.target=[(i-1)*.4,0,-1];});config.lights.fill.enabled=false;rig.sync();rig.editing=true;rig.sync();}reset();
const state={role:'tool',connectionId:1,connected:true,tracked:true,gripTracked:true,buttons:{trigger:{pressed:false,justPressed:false}}};
document.querySelector('#reset').onclick=reset;document.querySelector('#fill').onclick=()=>{config.lights.fill.enabled=!config.lights.fill.enabled;};document.querySelector('#rotate').onclick=()=>{const ray=new Matrix4().makeTranslation(config.lights.key.position[0],config.lights.key.position[1],config.lights.key.position[2]+1),grip=new Matrix4().makeTranslation(...config.lights.key.position);state.buttons.trigger={pressed:false,justPressed:false};rig.step(state,ray,true,grip);state.buttons.trigger={pressed:true,justPressed:true};rig.step(state,ray,true,grip);state.buttons.trigger.justPressed=false;const hand=new Matrix4().makeRotationY(.65).multiply(new Matrix4().makeRotationZ(.3)).setPosition(grip.elements[12]+.04,grip.elements[13]+.08,grip.elements[14]);rig.step(state,ray,true,hand);state.buttons.trigger={pressed:false,justPressed:false};rig.step(state,ray,true,hand);};renderer.debug.onShaderError=()=>document.querySelector('#errors').textContent='SHADER ERROR';renderer.setAnimationLoop(time=>{rig.sync(time);renderer.render(scene,camera);const p=config.lights.key;document.querySelector('#status').textContent=`Key position ${p.position.map(v=>v.toFixed(2)).join(', ')} · target ${p.target.map(v=>v.toFixed(2)).join(', ')} · roll ${((p.roll??0)*180/Math.PI).toFixed(1)}° · Fill ${config.lights.fill.enabled?'on / open':'off / closed'} · ${renderer.info.render.calls} helper draws`;});
</script></body></html>
