<!doctype html><html><head><meta charset="utf-8"><title>Phase 4.4 Mirror / Turntable verification</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#162128;color:#eef7f5;font:16px system-ui}h1{font-size:24px;margin:0 0 12px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}button,select{padding:10px;font:inherit;background:#293c46;color:white;border:1px solid #6b8b95;border-radius:8px}main{display:flex;gap:24px;flex-wrap:wrap}.panel{width:576px}.panel canvas{width:576px;height:576px;display:block}#scene{background:repeating-conic-gradient(#d9d7cb 0% 25%,#a6bebc 0% 50%) 0/64px 64px;border-radius:18px;overflow:hidden}p{max-width:1152px;color:#b7cbce}output{display:block;margin-top:12px}#benchmark-result{color:#97dfc9}</style></head><body>
<h1>World Settings · actual application menu and scene</h1>
<p>Browser verification fixture. Desktop poses and simulated AR transparency; no headset or camera passthrough test.</p>
<header><label>Section <select id="section"><option value="home">World home</option><option value="background" selected>Studio Background</option><option value="environment">Environment</option><option value="guides">Guides and Constraints</option><option value="preferences">Preferences</option><option value="mirror-guide">Mirror guide</option><option value="turntable">Turntable</option><option value="pivot">Pivot</option></select></label><label>Preview <select id="environment"><option value="studio">Studio</option><option value="passthrough">Simulated transparent AR</option></select></label><label>UI size <select id="size"><option value="normal" selected>Default</option><option value="large">Large</option></select></label><button id="benchmark">Measure cached updates</button></header>
<main><section class="panel"><div id="menu"></div></section><section class="panel"><div id="scene"></div></section></main><output id="status"></output><output id="rotation-state"></output><output id="benchmark-result"></output>
<script type="module">
import {Scene,PerspectiveCamera,WebGLRenderer,AmbientLight,DirectionalLight} from 'three';
import {XRMirrorPlane} from '/src/xr-mirror-plane.ts';import {turntableSettings} from '/src/world-settings.ts';
import {XRMenuModel} from '/src/xr-menu-model.ts';import {XRMenuView} from '/src/xr-menu-view.ts';import {XRSceneRig} from '/src/xr-scene.ts';import {IndependentLayers} from '/src/independent-layers.ts';import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';import {EditorToolState} from '/src/editor-tool-state.ts';
const settings={mode:'add',radius:.22,strength:.35,hardness:0,camera:{position:[2,2,3],target:[0,0,0]}},layers=new IndependentLayers(createBaseProject(new SDFVolume(33),settings)),shape=new ShapePreviewModel(layers.project.activeLayerId);let state={...settings},clock=0;
const tools=new EditorToolState({layers:()=>layers,shape,settings:()=>state,setSettings:v=>state=v,mode:()=> 'sculpt',selectTool(){},selectTransform(){},busy:()=>false,changed(){paint();}}),model=new XRMenuModel(tools,{turntable:()=>rig.turntable}),view=new XRMenuView(model);
view.place({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});document.getElementById('menu').append(view.canvas);
const scene=new Scene(),camera=new PerspectiveCamera(55,1,.01,30),renderer=new WebGLRenderer({antialias:true,alpha:true}),rig=new XRSceneRig(scene,camera);renderer.setSize(576,576);renderer.setClearAlpha(0);document.getElementById('scene').append(renderer.domElement);rig.sculptureRoot.add(layers.group);scene.add(new AmbientLight(0xffffff,2));const light=new DirectionalLight(0xffffff,3);light.position.set(2,4,2);scene.add(light);const mirror=new XRMirrorPlane(tools,scene);Object.assign(layers.symmetry,{enabled:true,axis:'z',offset:0});
function enter(){rig.exit();rig.applyWorldSettings(layers.display.world);rig.enter([],document.getElementById('environment').value);rig.placeFirstView({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});camera.position.set(0,1.6,0);camera.lookAt(0,1.48,-.9);}
function paint(){document.getElementById('size').value=layers.display.vrUiScale;rig.applyWorldSettings(layers.display.world);mirror.sync();view.update('world',undefined,undefined,clock+=200,true);model.world.section=document.getElementById('section').value;view.update('world',undefined,undefined,clock+=200,true);renderer.render(scene,camera);document.getElementById('status').textContent=`${layers.display.world.studioBackground} · Ground grid ${layers.display.world.groundGrid?'On':'Off'} · Mirror ${layers.display.world.mirrorGuide?.mode??'grid'} · Symmetry ${layers.symmetry.enabled?'On':'Off'} · ${scene.background?'opaque Studio':'transparent AR'} · ${layers.undoCount} Undo / ${layers.redoCount} Redo · UI ${layers.display.vrUiScale}`;}
view.canvas.onclick=e=>{const r=view.canvas.getBoundingClientRect(),id=model.hit((e.clientX-r.left)*1152/r.width,(e.clientY-r.top)*1152/r.height);if(id){model.activate(id);document.getElementById('section').value=model.world.section;paint();}};
document.getElementById('section').onchange=paint;document.getElementById('environment').onchange=()=>{enter();paint();};document.getElementById('size').onchange=e=>{layers.display.vrUiScale=e.target.value;paint();};
document.getElementById('benchmark').onclick=()=>{paint();const paints=view.paintCount,times=[],grid=rig.groundGrid.geometry,background=scene.background;for(let i=0;i<360;i++){const start=performance.now();rig.applyWorldSettings(layers.display.world);mirror.sync();view.update('world',undefined,undefined,clock+=16,true);times.push(performance.now()-start);}times.sort((a,b)=>a-b);document.getElementById('benchmark-result').textContent=`Host only · 360 cached updates CPU ${times.reduce((a,b)=>a+b,0).toFixed(2)} ms · p95 ${times[Math.floor(times.length*.95)].toFixed(3)} ms · max ${times.at(-1).toFixed(3)} ms · ${view.paintCount-paints} repaints · same background ${background===scene.background} · same grid ${grid===rig.groundGrid.geometry} · excludes renderer/Quest`;};enter();paint();function animate(time){rig.turntable.step(time,turntableSettings(layers.display.world));mirror.sync();renderer.render(scene,camera);document.getElementById('rotation-state').textContent=`Turntable ${rig.turntable.enabled?'On':'Off'} · ${rig.turntable.paused?'Paused':'Running'} · angle ${rig.turntable.angle.toFixed(3)} radians`;requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></body></html>
