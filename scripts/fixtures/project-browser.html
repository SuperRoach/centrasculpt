<!doctype html><html><meta charset="utf-8"><title>Project Browser · XR panel verification</title><style>body{margin:20px;background:#14272b;color:#effaf8;font:16px system-ui}button{padding:12px;margin:4px;font:inherit;border-radius:10px}#stage{width:min(720px,94vw);background:repeating-conic-gradient(#ccc 0% 25%,#78918d 0% 50%) 0/60px 60px}canvas{width:100%;display:block}</style><h1>Project Browser · actual XR canvas</h1><p>Host preview only. Physical Quest acceptance PENDING.</p><button id="library">Library</button><button id="details">Details</button><button id="new">New project keyboard</button><button id="environment">Studio / transparent background</button><div id="stage"></div><script type="module">
import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {IndependentLayers} from '/src/independent-layers.ts';import {EditorToolState} from '/src/editor-tool-state.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';import {XRMenuModel} from '/src/xr-menu-model.ts';import {XRMenuView} from '/src/xr-menu-view.ts';import {ProjectBrowser} from '/src/project-browser.ts';
const settings={mode:'add',radius:.2,strength:.7,hardness:.3,camera:{position:[2,2,3],target:[0,0,0]}},layers=new IndependentLayers(createBaseProject(new SDFVolume(17),settings));const browser=new ProjectBrowser({list:async()=>browser.records},{key:()=>layers.recoveryKey(),ready:()=>true,changed(){}});browser.name='Coral study';browser.records=['Coral study','Portrait · painted clay','Spline experiments'].map((name,i)=>({id:String(i),name,modified:Date.now()-i*86400000,opened:i?0:Date.now(),revision:1,bytes:8*1024**2,version:8,sourceVersion:8,resolutions:[128],layers:i+1}));
const tools=new EditorToolState({layers:()=>layers,shape:new ShapePreviewModel(layers.project.activeLayerId),settings:()=>settings,setSettings(){},mode:()=> 'sculpt',selectTool(){},selectTransform(){},busy:()=>false,changed(){}}),model=new XRMenuModel(tools,{projectBrowser:browser}),view=new XRMenuView(model);view.place({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});document.querySelector('#stage').append(view.canvas);model.setRequest('world');model.world.section='project';
view.canvas.onclick=e=>{const r=view.canvas.getBoundingClientRect(),id=model.hit((e.clientX-r.left)*1152/r.width,(e.clientY-r.top)*1152/r.height);if(id)model.activate(id);};
document.querySelector('#library').onclick=()=>{browser.form=null;browser.selected=null;model.world.section='project';};document.querySelector('#details').onclick=()=>{browser.form=null;browser.selected='0';};document.querySelector('#new').onclick=()=>browser.activate('library:new');let studio=true;document.querySelector('#environment').onclick=()=>{studio=!studio;document.querySelector('#stage').style.background=studio?'#14272b':'';};function frame(now){view.update('world',undefined,undefined,now,true);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
