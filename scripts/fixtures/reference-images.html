<!doctype html><html><head><title>Phase 4.5 Reference Images</title><style>body{margin:20px;background:#26323c;color:white;font:18px system-ui}header{display:flex;gap:20px;margin-bottom:15px}main{display:flex;gap:20px}#menu canvas{width:576px;height:576px}button,select{font:inherit;padding:10px}output{display:block;margin:12px;max-width:1100px}.viewport{background:repeating-conic-gradient(#677780 0% 25%,#87969c 0% 50%) 0/40px 40px}</style></head><body>
<header><label>Environment <select id="environment"><option>studio</option><option>passthrough</option></select></label><label>Page <select id="page"><option>references</option><option>reference</option><option>reference-pose</option><option>reference-more</option><option>reference-delete</option><option>home</option></select></label><button id="bench">Benchmark 900 updates</button><button id="rotate">Rotate sculpture</button></header><main><div id="menu"></div><div class="viewport" id="viewport"></div></main><output id="status">Loading…</output><output id="result"></output>
<script type="module">
import {Scene,PerspectiveCamera,WebGLRenderer,AmbientLight,Vector3} from '/node_modules/three/build/three.module.js';import {ReferenceView} from '/src/reference-view.ts';import {createReference} from '/src/reference-images.ts';import {XRSceneRig} from '/src/xr-scene.ts';import {IndependentLayers} from '/src/independent-layers.ts';import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {EditorToolState} from '/src/editor-tool-state.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';import {XRMenuModel} from '/src/xr-menu-model.ts';import {XRMenuView} from '/src/xr-menu-view.ts';import {defaultTurntable} from '/src/turntable.ts';
const settings={mode:'add',radius:.22,strength:.35,hardness:0,camera:{position:[2,2,3],target:[0,0,0]}},layers=new IndependentLayers(createBaseProject(new SDFVolume(33),settings)),scene=new Scene(),camera=new PerspectiveCamera(55,1,.01,30),rig=new XRSceneRig(scene,camera),renderer=new WebGLRenderer({alpha:true,antialias:true});renderer.setSize(576,576);renderer.setClearAlpha(0);document.querySelector('#viewport').append(renderer.domElement);rig.sculptureRoot.add(layers.group);scene.add(new AmbientLight(0xffffff,3));const refs=new ReferenceView(()=>layers.display.references,rig.workspaceRoot,rig.turntable.group);
const tools=new EditorToolState({layers:()=>layers,shape:new ShapePreviewModel(layers.project.activeLayerId),settings:()=>settings,setSettings(){},mode:()=> 'sculpt',selectTool(){},selectTransform(){},busy:()=>false,changed(){}}),model=new XRMenuModel(tools,{references:refs}),menu=new XRMenuView(model);document.querySelector('#menu').append(menu.canvas);menu.place({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});model.setRequest('tool-wheel');model.activate('world');
const bytes=new Uint8Array(await (await fetch('/outputs/phase-4-5/orientation.png')).arrayBuffer());const r=createReference(bytes,'Colour / orientation reference','sample');r.position=[1.35,.3,0];r.locked=false;layers.display.references=[r,{...createReference(bytes,'Sculpture-attached','sculpture'),position:[-1.35,.3,0],space:'sculpture'}];refs.selected=r.id;refs.editing=true;
function enter(){rig.exit();rig.enter([],document.querySelector('#environment').value);rig.placeFirstView({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});camera.position.set(0,1.6,.6);camera.lookAt(0,1.48,-.9);}enter();
document.querySelector('#environment').onchange=enter;document.querySelector('#rotate').onclick=()=>{rig.turntable.enabled=!rig.turntable.enabled;};document.querySelector('#bench').onclick=()=>{const timings=[],textures=[...refs.panels.values()].map(p=>p.texture);for(let i=0;i<900;i++){const start=performance.now();refs.sync();rig.turntable.step(i*11,defaultTurntable());timings.push(performance.now()-start);}timings.sort((a,b)=>a-b);document.querySelector('#result').textContent=JSON.stringify({hostOnly:true,updates:900,totalCPU:timings.reduce((a,b)=>a+b,0),p95:timings[855],max:timings.at(-1),sameTextures:textures.every((t,i)=>t===[...refs.panels.values()][i].texture),undo:layers.undoCount,excludes:'renderer, headset, decoding'},null,2);};
menu.canvas.onclick=e=>{const r=menu.canvas.getBoundingClientRect(),id=model.hit((e.clientX-r.left)*1152/r.width,(e.clientY-r.top)*1152/r.height);if(id){model.activate(id);document.querySelector('#page').value=model.world.section;}};
renderer.setAnimationLoop(time=>{refs.sync();model.world.section=document.querySelector('#page').value;menu.update('world',undefined,undefined,time,true);model.world.section=document.querySelector('#page').value;menu.update('world',undefined,undefined,time+1,true);rig.turntable.step(time,defaultTurntable());renderer.render(scene,camera);document.querySelector('#status').textContent=`${refs.panels.size} references · ${renderer.info.memory.textures} GPU textures · ${layers.undoCount} Undo · ${scene.background?'Studio':'Transparent AR simulation'} · ${refs.error||'Images unlit, red TOP / blue BOTTOM · right workspace, left sculpture'}`;});
</script></body></html>
