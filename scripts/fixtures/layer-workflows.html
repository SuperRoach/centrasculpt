<!doctype html><html><head><meta charset="utf-8"><title>Advanced layer workflows</title><style>body{margin:24px;background:#18252a;color:#eef6ef;font:16px system-ui}button,select{font:inherit;padding:10px;margin:5px;border-radius:8px}main{display:flex;gap:20px;flex-wrap:wrap}.stage{width:560px;height:560px;background:repeating-conic-gradient(#cfcfbd 0% 25%,#7c999e 0% 50%) 0/64px 64px}canvas{width:560px;height:560px}output{display:block;margin:10px}</style></head><body><h1>Advanced Layer Workflows</h1><p>Independent child sources · nested metadata transforms · actual XR palette. Physical Quest acceptance pending.</p><button id="group-move">Move group</button><button id="group-reset">Reset group transform</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="layers">Layers palette</button><select id="environment" aria-label="Environment"><option>Studio</option><option>Simulated Passthrough</option></select><main><div class="stage" id="scene"></div><div class="stage" id="menu"></div></main><output id="status"></output><output id="error"></output><script type="module">
import {Scene,PerspectiveCamera,WebGLRenderer,HemisphereLight,DirectionalLight,Color} from 'three';import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {IndependentLayers} from '/src/independent-layers.ts';import {identityTransform} from '/src/transform.ts';import {EditorToolState} from '/src/editor-tool-state.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';import {XRMenuModel} from '/src/xr-menu-model.ts';import {XRMenuView} from '/src/xr-menu-view.ts';
const settings={mode:'add',radius:.2,strength:.7,hardness:.3,camera:{position:[2,2,3],target:[0,0,0]}},layers=new IndependentLayers(createBaseProject(new SDFVolume(33),settings));const a=layers.active.layer;a.name='Body';a.transform={position:[-.55,0,0],rotation:[0,0,0],scale:[.7,.7,.7]};const b=layers.duplicate(a.id);b.name='Detail';b.transform={position:[.55,0,0],rotation:[0,0,0],scale:[.5,.5,.5]};const g=layers.createGroup('Sculpt Assembly');layers.reparent(a.id,g);layers.reparent(b.id,g);layers.selectGroup(g);layers.display.setColour(layers.project.id,b.id,'#b29bd2');layers.syncPresentation();
const scene=new Scene(),camera=new PerspectiveCamera(45,1,.01,30),renderer=new WebGLRenderer({antialias:true,alpha:true});renderer.setSize(560,560);document.querySelector('#scene').append(renderer.domElement);scene.add(layers.group,new HemisphereLight(0xffffff,0x687267,2.2));const light=new DirectionalLight(0xfff4df,3);light.position.set(-2,3,4);scene.add(light);scene.background=new Color('#334840');camera.position.set(0,.3,3.6);camera.lookAt(0,0,0);let mode='translate',state={...settings};const tools=new EditorToolState({layers:()=>layers,shape:new ShapePreviewModel(a.id),settings:()=>state,setSettings:v=>state=v,mode:()=>mode,selectTool:t=>mode=t==='transform'?'translate':'sculpt',selectTransform:v=>mode=v,busy:()=>false,changed(){layers.syncPresentation();}}),model=new XRMenuModel(tools),view=new XRMenuView(model);view.place({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});model.setRequest('layers');document.querySelector('#menu').append(view.canvas);view.canvas.onclick=e=>{const r=view.canvas.getBoundingClientRect(),id=model.hit((e.clientX-r.left)*1152/r.width,(e.clientY-r.top)*1152/r.height);if(id)model.activate(id);};
for(const [id,action]of [['group-move',()=>{layers.selectGroup(g);layers.setActiveTransform({position:[.2,.2,0],rotation:[0,0,.3],scale:[1.15,1.15,1.15]});}],['group-reset',()=>{layers.selectGroup(g);layers.setActiveTransform(identityTransform());}],['undo',()=>layers.undo()],['redo',()=>layers.undo(true)],['layers',()=>{model.palette.view='list';model.palette.context=null;model.palette.page=0;model.page='layers';}]])document.getElementById(id).onclick=()=>{try{action();}catch(e){document.querySelector('#error').textContent=e.message;}};document.querySelector('#environment').onchange=e=>scene.background=e.target.value==='Studio'?new Color('#334840'):null;renderer.debug.onShaderError=()=>document.querySelector('#error').textContent='Shader error';renderer.setAnimationLoop(now=>{view.update('layers',undefined,undefined,now,true);renderer.render(scene,camera);document.querySelector('#status').textContent=`${layers.project.layerStack.layers.length} independent sources · ${layers.project.layerStack.hierarchy.groups.length} groups · ${layers.undoCount} Undo / ${layers.redoCount} Redo · ${layers.pendingChunks} remesh chunks · ${scene.background?'Studio':'transparent AR'}`;});
</script></body></html>
