<!doctype html><meta charset="utf-8"><title>Disposable recovery test lab</title><style>body{font:16px system-ui;max-width:900px;margin:30px auto;padding:20px}button{padding:12px;margin:6px}output{display:block;white-space:pre-wrap;margin:20px 0}</style>
<h1>Disposable recovery test lab</h1><p>Uses only <code>centra-sculpt-recovery-test</code>. The application's ordinary recovery database is untouched.</p><button id="seed">Seed valid recovery</button><button id="corrupt">Add corrupt-checksum checkpoint</button><button id="abort">Abort a transaction</button><button id="clear">Clear test checkpoints</button><p><a href="/?recoveryFixture=lab" target="_blank">Open the application with this test database</a></p><output id="result" role="status">Ready</output>
<script type="module">
import {IndexedRecoveryStore} from '/src/recovery-store.ts';import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {saveSculptProject} from '/src/project.ts';import {defaultToolPreferences} from '/src/tool-preferences.ts';import {checksum} from '/src/project-snapshot.ts';
const name='centra-sculpt-recovery-test',store=new IndexedRecoveryStore(indexedDB,name),result=document.querySelector('#result');let data,record;
const settings={mode:'add',radius:.22,strength:.35,hardness:.5,camera:{position:[2.4,1.7,3.3],target:[0,0,0]}};
document.querySelector('#seed').onclick=async()=>{try{await store.clear();await store.setEnabled(true);const p=createBaseProject(new SDFVolume(33),settings);p.name='Recovery Test Sculpture';p.activeLayer.name='Recovered Base';p.activeLayer.transform.position=[.25,.1,0];p.toolPreferences=defaultToolPreferences();p.toolPreferences.symmetry.enabled=true;p.toolPreferences.symmetry.offset=.1;p.toolPreferences.move.precision=true;p.toolPreferences.move.snap=45;p.toolPreferences.path.straightLine=true;p.toolPreferences.path.axis='x';data=saveSculptProject(p);record={id:'lab-valid',format:1,projectId:p.id,projectName:p.name,createdAt:Date.now(),revision:'fixture',bytes:data.byteLength,checksum:checksum(data)};await store.write(record,data,new AbortController().signal);result.textContent=`Seeded valid checkpoint: ${p.name}, ${data.byteLength} bytes.`;}catch(e){result.textContent=String(e);}};
document.querySelector('#corrupt').onclick=async()=>{if(!record){result.textContent='Seed a checkpoint first.';return;}await store.write({...record,id:'lab-corrupt',createdAt:Date.now(),checksum:record.checksum^1},data,new AbortController().signal);result.textContent='Added corrupt checksum. The older valid checkpoint remains available.';};
document.querySelector('#abort').onclick=async()=>{const db=await new Promise((resolve,reject)=>{const r=indexedDB.open(name,1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});const tx=db.transaction(['records','payloads'],'readwrite');tx.objectStore('records').put({...record,id:'interrupted'},'interrupted');tx.objectStore('payloads').put(data,'interrupted');tx.abort();tx.onabort=async()=>{db.close();result.textContent=`Transaction aborted. Available: ${(await store.list()).map(r=>r.id).join(', ')}`;};};
document.querySelector('#clear').onclick=async()=>{await store.clear();result.textContent='Test recovery cleared.';};
</script>
