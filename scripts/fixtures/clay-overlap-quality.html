<!doctype html><meta charset="utf-8"><title>Clay overlap regression comparison</title>
<style>body{margin:0;background:#303a3d;color:white;font:14px system-ui}h1,p{margin:12px 16px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}.tile{position:relative}.tile span{position:absolute;bottom:8px;left:10px;color:#182c33}canvas{display:block;width:100%!important;height:auto!important}.tile span{font-size:10px;background:#e9e9e3cc}</style>
<h1>Clay overlapping the starter sphere</h1><p>Before / corrected · identical lights, material and camera · 64³ top, 128³ bottom.<br>Circle partly embedded in sphere; inspect adjacent sphere surface. Actual desktop WebGL.</p><main></main>
<script type="module">
import * as T from 'three';
import {SDFVolume} from '/work/test-build/sdf.mjs';
import {SDFVolume as Before} from '/work/test-build/sdf-overlap-before.mjs';
import {ClayStroke} from '/work/test-build/stroke.mjs';
import {IncrementalMesher} from '/work/test-build/mesh.mjs';
for(const n of [64,128])for(const before of [true,false]){
 const v=new (before?Before:SDFVolume)(n),stroke=new ClayStroke();
 for(let i=0;i<=48;i++){const a=i/48*2*Math.PI;stroke.apply(v,{x:.35*Math.cos(a),y:.35*Math.sin(a),z:.8},.16,'add',.35,1/90,undefined,.6,undefined,true);}
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(420,220);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;
 const scene=new T.Scene();scene.background=new T.Color('#e9e9e3');scene.add(new T.HemisphereLight(0xffffff,0x687267,2.7));
 for(const [color,intensity,position] of [[0xfff4df,3.4,[-3,5,4]],[0xd6eaff,1.4,[4,1,-2]]]){const light=new T.DirectionalLight(color,intensity);light.position.set(...position);scene.add(light);}
 const camera=new T.PerspectiveCamera(38,420/220,.01,10);camera.position.set(1.2,.8,3.4);camera.lookAt(0,0,0);
 const material=new T.MeshStandardMaterial({color:'#86aeb8',roughness:.68,metalness:.03});
 const mesher=new IncrementalMesher(v,16);for(const u of mesher.rebuildChunks().updates)if(u.geometry.getAttribute('position').count)scene.add(new T.Mesh(u.geometry,material));
 const tile=document.createElement('div');tile.className='tile';const label=document.createElement('span');label.textContent=`${n}³ · ${before?'Before · scaled exterior':'Corrected · metric surface band'}`;tile.append(renderer.domElement,label);document.querySelector('main').append(tile);renderer.render(scene,camera);
}
document.body.dataset.ready='true';
</script>
