<!doctype html><html><head><meta charset="utf-8"><title>Phase 4.6 Lighting verification</title><style>
body{margin:24px;background:#18252a;color:#eef6ef;font:16px system-ui}h1{font-size:24px}button,select{font:inherit;padding:10px;margin:6px;border-radius:8px}main{display:flex;flex-wrap:wrap;gap:20px}.stage{width:576px;height:576px;background:repeating-conic-gradient(#cfcfbd 0% 25%,#7c999e 0% 50%) 0/64px 64px;border-radius:12px;overflow:hidden}canvas{display:block;width:576px;height:576px}output{display:block;margin-top:12px}</style></head><body><h1>Lighting · actual XR menu and scene</h1><p>Host preview; transparent AR simulation. Physical Quest acceptance pending.</p><label>Panel <select id="section"><option value="lighting">Lighting</option><option value="light">Light settings</option><option value="light-colour">Colours</option><option value="light-position">Position</option><option value="inspection">Inspection</option></select></label><label>Environment <select id="environment"><option value="studio">Studio</option><option value="passthrough">Simulated Passthrough</option></select></label><button id="benchmark">Measure 10,000 lighting updates</button><main><div class="stage" id="menu"></div><div class="stage" id="scene"></div></main><output id="status"></output><output id="measurement"></output>
<script type="module">
import {Scene,PerspectiveCamera,WebGLRenderer,HemisphereLight,DirectionalLight} from 'three';
import {XRSceneRig} from '/src/xr-scene.ts';import {LightRig} from '/src/light-rig.ts';import {XRMenuModel} from '/src/xr-menu-model.ts';import {XRMenuView} from '/src/xr-menu-view.ts';import {IndependentLayers} from '/src/independent-layers.ts';import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';import {EditorToolState} from '/src/editor-tool-state.ts';
const settings={mode:'add',radius:.22,strength:.35,hardness:0,camera:{position:[2,2,3],target:[0,0,0]}},layers=new IndependentLayers(createBaseProject(new SDFVolume(33),settings));
const scene=new Scene(),camera=new PerspectiveCamera(55,1,.01,30),renderer=new WebGLRenderer({antialias:true,alpha:true}),xr=new XRSceneRig(scene,camera);renderer.setSize(576,576);renderer.setClearAlpha(0);document.querySelector('#scene').append(renderer.domElement);xr.sculptureRoot.add(layers.group);
const ambient=new HemisphereLight('#ffffff','#687267',2.7),key=new DirectionalLight('#fff4df',3.4),fill=new DirectionalLight('#d6eaff',1.4);key.position.set(-3,5,4);fill.position.set(4,1,-2);scene.add(ambient,key,fill);const lighting=new LightRig(()=>layers.display.lighting,xr.workspaceRoot,key,fill,ambient);
const tools=new EditorToolState({layers:()=>layers,shape:new ShapePreviewModel(layers.project.activeLayerId),settings:()=>settings,setSettings(){},mode:()=> 'sculpt',selectTool(){},selectTransform(){},busy:()=>false,changed(){}}),model=new XRMenuModel(tools,{lighting}),view=new XRMenuView(model);document.querySelector('#menu').append(view.canvas);view.place({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});model.setRequest('world');model.world.section='lighting';
function enter(){xr.exit();xr.enter([],document.querySelector('#environment').value);xr.placeFirstView({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});camera.position.set(0,1.6,.7);camera.lookAt(0,1.48,-.9);}enter();
view.canvas.onclick=e=>{const r=view.canvas.getBoundingClientRect(),id=model.hit((e.clientX-r.left)*1152/r.width,(e.clientY-r.top)*1152/r.height);if(id){model.activate(id);document.querySelector('#section').value=model.world.section;}};
document.querySelector('#section').onchange=e=>model.world.section=e.target.value;document.querySelector('#environment').onchange=enter;
document.querySelector('#benchmark').onclick=()=>{const start=performance.now(),geometries=renderer.info.memory.geometries;for(let i=0;i<10000;i++)lighting.sync(i*11);document.querySelector('#measurement').textContent=`10,000 host CPU updates: ${(performance.now()-start).toFixed(2)} ms; WebGL geometries ${geometries} → ${renderer.info.memory.geometries}. Excludes render/GPU/Quest.`;};
renderer.setAnimationLoop(now=>{lighting.sync(now);view.update('world',undefined,undefined,now,true);renderer.render(scene,camera);document.querySelector('#status').textContent=`Rig ${lighting.config.enabled?'On':'Off'} · Edit ${lighting.editing?'On':'Off'} · Inspection ${lighting.inspection.enabled?'On':'Off'} · ${scene.background?'Studio':'transparent AR'} · ${layers.undoCount} Undo / ${layers.redoCount} Redo`;});
</script></body></html>
