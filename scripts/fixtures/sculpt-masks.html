<!doctype html><html><head><meta charset="utf-8"><title>Phase 4.7 Masks verification</title><style>body{margin:24px;background:#18252a;color:#eef6ef;font:16px system-ui}button,select{font:inherit;padding:10px;margin:5px;border-radius:8px}main{display:flex;gap:20px;flex-wrap:wrap}.stage{width:560px;height:560px;background:repeating-conic-gradient(#cfcfbd 0% 25%,#7c999e 0% 50%) 0/64px 64px}canvas{width:560px;height:560px}output{display:block;margin:10px}</style></head><body><h1>Sculpting masks · host verification</h1><p>Actual surface shader and XR menu. Simulated Passthrough; physical Quest 3 validation pending.</p><button id="paint">Paint mask</button><button id="clay">Sculpt across mask</button><button id="overlay">Hide overlay</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="move">Move preview</button><button id="cancel">Cancel Move</button><label>Material <select id="style"><option value="normal">Normal</option><option value="matte">Matte</option><option value="glossy">Glossy</option></select></label><label>Environment <select id="environment"><option>Studio</option><option>Passthrough</option></select></label><main><div class="stage" id="scene"></div><div class="stage" id="menu"></div></main><output id="status"></output><output id="errors">No shader errors</output><script type="module">
import {Scene,PerspectiveCamera,WebGLRenderer,HemisphereLight,DirectionalLight,Color,Vector3} from 'three';
import {IndependentLayers} from '/src/independent-layers.ts';import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {sculptMask} from '/src/sculpt-mask.ts';import {EditorToolState} from '/src/editor-tool-state.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';import {XRMenuModel} from '/src/xr-menu-model.ts';import {XRMenuView} from '/src/xr-menu-view.ts';import {MoveMeshPreview} from '/src/move-mesh-preview.ts';
let state={mode:'add',radius:.3,strength:1,hardness:.3,camera:{position:[2,2,3],target:[0,0,0]}};const layers=new IndependentLayers(createBaseProject(new SDFVolume(64),state)),scene=new Scene(),camera=new PerspectiveCamera(45,1,.01,20),renderer=new WebGLRenderer({antialias:true,alpha:true});renderer.setSize(560,560);document.querySelector('#scene').append(renderer.domElement);scene.add(layers.group,new HemisphereLight(0xffffff,0x687267,2.2));const key=new DirectionalLight(0xfff4df,3);key.position.set(-2,3,4);scene.add(key);camera.position.set(0,.3,2.7);camera.lookAt(0,0,0);scene.background=new Color('#334840');renderer.debug.onShaderError=()=>document.querySelector('#errors').textContent='SHADER ERROR';
const tools=new EditorToolState({layers:()=>layers,shape:new ShapePreviewModel(layers.project.activeLayerId),settings:()=>state,setSettings:v=>state=v,mode:()=> 'sculpt',selectTool:()=>{state={...state,mode:'add'};},selectTransform(){},busy:()=>false,changed(){}}),model=new XRMenuModel(tools),view=new XRMenuView(model),preview=new MoveMeshPreview();document.querySelector('#menu').append(view.canvas);model.setRequest('tool-wheel');view.place({x:0,y:1,z:0},{x:0,y:0,z:0,w:1});
view.canvas.onclick=e=>{const r=view.canvas.getBoundingClientRect(),id=model.hit((e.clientX-r.left)*1152/r.width,(e.clientY-r.top)*1152/r.height);if(id)model.activate(id);};
document.querySelector('#paint').onclick=()=>{layers.beginStroke(true);for(let i=0;i<10;i++)layers.applyStrokeLocal({x:-.15,y:0,z:.8},.4,'mask',1,.05,.6);layers.finishStroke();};document.querySelector('#clay').onclick=()=>{layers.beginStroke();for(let i=0;i<10;i++)layers.applyStrokeLocal({x:.1,y:0,z:.8},.4,'subtract',1,.05,.4);layers.finishStroke();};document.querySelector('#overlay').onclick=e=>{layers.maskOverlayVisible=!layers.maskOverlayVisible;e.target.textContent=layers.maskOverlayVisible?'Hide overlay':'Show overlay';};document.querySelector('#undo').onclick=()=>layers.undo();document.querySelector('#redo').onclick=()=>layers.undo(true);document.querySelector('#style').onchange=e=>{layers.display.renderStyle=e.target.value;layers.syncPresentation();};document.querySelector('#environment').onchange=e=>scene.background=e.target.value==='Studio'?new Color('#334840'):null;document.querySelector('#move').onclick=()=>{layers.updateMaskOverlays(Infinity);preview.begin(layers.active.surface.group,new Vector3(0,0,.8),.4,2,1,Infinity);preview.update(new Vector3(.15,.05,.1));};document.querySelector('#cancel').onclick=()=>preview.cancel();renderer.setAnimationLoop(time=>{layers.updateMaskOverlays();view.update(model.request,undefined,undefined,time,true);renderer.render(scene,camera);document.querySelector('#status').textContent=`${layers.undoCount} Undo / ${layers.redoCount} Redo · ${layers.active.triangles} triangles · ${sculptMask(layers.active.volume).memoryBytes} mask bytes · ${layers.maskOverlayVisible?'Overlay visible':'Overlay hidden'} · ${scene.background?'Studio':'transparent AR'}`;});
</script></body></html>
