<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Centra Sculpt · VR menu design checks</title>
<style>body{margin:0;font:16px system-ui;background:#263039;color:#edf5f1}header{padding:20px}h1{font-size:22px;margin:0 0 12px}button,select{font:inherit;padding:10px;margin:4px;border-radius:8px;border:1px solid #8a9e9e;background:#1c2e36;color:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:16px;padding:16px}.stage{border-radius:16px;overflow:hidden;min-width:0;background:#888;position:relative}.stage.bright{background:linear-gradient(30deg,#e1d5c6,#fff 30%,#8fb19c 45%,#fff 80%)}.stage.dark{background:linear-gradient(30deg,#070e16,#263548,#111)}canvas{display:block;width:100%;height:auto}h2{font-size:17px;padding:12px;margin:0;background:#17242c}output{display:block;margin:12px;color:#b2e5ce}body[data-scale=large] main{grid-template-columns:repeat(auto-fit,minmax(580px,1fr))}@media(max-width:650px){main,body[data-scale=large] main{grid-template-columns:minmax(0,1fr)}}</style>
<header><h1>VR menus · actual canvas renderer</h1><p>Host preview only. Grey Studio and simulated bright/dark backgrounds; physical headset acceptance pending.</p><label>Background <select id="background"><option value="studio">Studio grey</option><option value="bright">Bright surroundings</option><option value="dark">Dark surroundings</option></select></label><label>UI size <select id="size"><option value="normal" selected>Default</option><option value="large">Large</option></select></label><label>Options <select id="tool"></select></label><button id="next">Next options page</button><button id="hover">Toggle hover</button><button id="benchmark">Measure cached polling</button><output id="result"></output><output id="benchmark-result"></output></header>
<main><section class="stage"><h2>Floating Tool Wheel</h2><div id="wheel"></div></section><section class="stage"><h2>Tool Options · five rows per page</h2><div id="options"></div></section><section class="stage"><h2>Layers · all eight entries</h2><div id="layers"></div></section></main>
<script type="module">
import {tubePoint} from '/src/procedural-tube.ts';
import {XRMenuView} from '/src/xr-menu-view.ts';import {XRMenuModel} from '/src/xr-menu-model.ts';import {EditorToolState,EDITOR_TOOLS} from '/src/editor-tool-state.ts';import {IndependentLayers} from '/src/independent-layers.ts';import {SDFVolume} from '/src/sdf.ts';import {createBaseProject} from '/src/layers.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';
const settings={mode:'add',radius:.22,strength:.35,hardness:0,camera:{position:[2,2,3],target:[0,0,0]}},layers=new IndependentLayers(createBaseProject(new SDFVolume(17),settings));for(let i=1;i<7;i++){const layer=layers.create(64,true);layer.name=i===1?'Organic branches / an intentionally long layer name':`Layer ${i+1}`;}await layers.regenerateTube({kind:'tube',interpolation:'centripetal',closed:false,points:[tubePoint([-.5,0,0],.12),tubePoint([0,.3,0],.2),tubePoint([.5,0,0],.08)]});layers.project.layerStack.layers[2].locked=true;layers.project.layerStack.layers[3].visible=false;
const shape=new ShapePreviewModel(layers.project.activeLayerId);let state={...settings},mode='sculpt';const tools=new EditorToolState({layers:()=>layers,shape,settings:()=>state,setSettings:v=>state=v,mode:()=>mode,selectTool:id=>{shape.setEnabled(id==='stamp',layers.project.layerStack);mode=id==='transform'?'translate':'sculpt';if(id==='clay'||id==='smooth')state={...state,mode:id==='clay'?'add':'smooth'};},selectTransform:m=>mode=m,busy:()=>false,changed(){}});
const views={};for(const [id,page] of [['wheel','tool-wheel'],['options','tool-options'],['layers','layers']]){const model=new XRMenuModel(tools),view=new XRMenuView(model);view.place({x:0,y:1.6,z:0},{x:0,y:0,z:0,w:1});document.getElementById(id).append(view.canvas);views[id]={model,view,page};}
const select=document.getElementById('tool');EDITOR_TOOLS.forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.label;select.append(o);});let clock=0,hover=false;
function paint(){for(const {view,page} of Object.values(views))view.update(page,undefined,undefined,clock+=200,true);if(hover){const {model,view,page}=views.wheel;model.hover='tool:tube';view.paint(model.content());}const ctx=views.wheel.view.canvas.getContext('2d'),transparent=ctx.getImageData(16,600,1,1).data[3];document.getElementById('result').textContent=`12 tools · wheel gap alpha ${transparent} · UI scale ${layers.display.vrUiScale} · ${layers.undoCount} undo / ${layers.redoCount} redo`;document.body.dataset.scale=layers.display.vrUiScale;}
select.onchange=()=>{tools.select(select.value);views.options.model.optionPage=0;paint();};document.getElementById('next').onclick=()=>{views.options.model.activate('next');paint();};document.getElementById('hover').onclick=()=>{hover=!hover;paint();};document.getElementById('background').onchange=e=>{document.querySelectorAll('.stage').forEach(s=>s.className=`stage ${e.target.value}`);paint();};document.getElementById('size').onchange=e=>{layers.display.vrUiScale=e.target.value;paint();};document.getElementById('benchmark').onclick=()=>{hover=false;paint();const before=Object.values(views).reduce((n,{view})=>n+view.paintCount,0),times=[];for(let i=0;i<120;i++)for(const {view,page} of Object.values(views)){const start=performance.now();view.update(page,undefined,undefined,clock+=16,true);times.push(performance.now()-start);}times.sort((a,b)=>a-b);const paints=Object.values(views).reduce((n,{view})=>n+view.paintCount,0)-before;document.getElementById('benchmark-result').textContent=`Host canvas only · 360 polls CPU ${times.reduce((a,b)=>a+b,0).toFixed(2)} ms · p95 ${times[Math.floor(times.length*.95)].toFixed(3)} ms · max ${times.at(-1).toFixed(3)} ms · ${paints} repaints · no renderer/Quest timing`;};paint();
</script></html>
