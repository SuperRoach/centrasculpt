<!doctype html><html><head><meta charset="utf-8"><title>Persistent Non-Elastic Move validation</title><style>body{margin:0;background:#242b2d;color:#eaf2ee;font:15px system-ui}header{padding:18px 24px}h1{font-size:22px;margin:0 0 8px}button{padding:10px;margin:6px 4px 0 0;font:inherit}#view{height:450px;position:relative}canvas{display:block}output{display:block;padding:10px 24px;font:13px monospace}.labels{display:flex;position:absolute;left:0;right:0;top:10px;justify-content:space-around;pointer-events:none}p{margin:6px 0}</style></head><body><header><h1>Move · Non-Elastic · persistent SDF</h1><p>Left: original reference. Right: editable source. Hold/pull previews; release reconstructs and commits one Undo action.</p><button id="grab">Grab surface</button><button id="pull" disabled>Pull region</button><button id="long" disabled>Long pull / growth</button><button id="commit" disabled>Release / commit</button><button id="cancel">Cancel</button><button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><button id="verify">Verify native/source</button></header><div id="view"><div class="labels"><span>Original reference</span><span>Authoritative source / live preview</span></div></div><output id="state">Starting…</output><output id="check">Not checked</output><output id="metrics"></output><script type="module">
import * as THREE from 'three';import {SDFVolume} from '/src/sdf.ts';import {IndependentLayers} from '/src/independent-layers.ts';import {createBaseProject} from '/src/layers.ts';import {saveSculptProject,openSculptProject} from '/src/project.ts';import {EditorToolState} from '/src/editor-tool-state.ts';import {ShapePreviewModel} from '/src/shape-preview.ts';import {XRMoveTool} from '/src/xr-move-tool.ts';
const settings={mode:'add',radius:.2,strength:.35,hardness:.5,camera:{position:[2,2,3],target:[0,0,0]}},l=new IndependentLayers(createBaseProject(new SDFVolume(64),settings)),tools=new EditorToolState({layers:()=>l,shape:new ShapePreviewModel(l.project.activeLayerId),settings:()=>settings,setSettings(){},mode:()=> 'sculpt',selectTool(){},selectTransform(){},busy:()=>false,changed(){}});tools.select('move');tools.move.radius=.22;const elastic=new URLSearchParams(location.search).get('mode')==='elastic';if(elastic){tools.move.mode='elastic';document.title='Elastic Move validation';document.querySelector('h1').textContent='Move · Elastic · persistent SDF';}
const scene=new THREE.Scene();scene.background=new THREE.Color('#85888a');const root=new THREE.Group();l.group.position.x=1.1;scene.add(root,l.group);const baseline=l.exportGroup();baseline.position.x=-1.1;scene.add(baseline,new THREE.HemisphereLight(0xffffff,0x44484a,2));const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(-1,4,5);scene.add(light);
const move=new XRMoveTool(()=>l,tools,root),tool={role:'tool',connected:true,tracked:true,gripTracked:true,connectionId:1,buttons:{trigger:{pressed:false,rawValue:0,justPressed:false},grip:{pressed:false,rawValue:0}}},aim=new THREE.Matrix4().makeTranslation(1.1,0,1.5),grip=aim.clone(),view=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);view.append(renderer.domElement);let errors=0;renderer.debug.onShaderError=()=>errors++;const camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.set(0,1.3,5.6);camera.lookAt(0,0,0);const resize=()=>{renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();};addEventListener('resize',resize);resize();const original=new Uint8Array(saveSculptProject(l.project));
const $=id=>document.querySelector('#'+id),verify=()=>{const data=saveSculptProject(l.project),now=new Uint8Array(data),same=now.length===original.length&&now.every((v,i)=>v===original[i]),loaded=openSculptProject(data),equal=loaded.layerStack.layers[0].volume.values.every((v,i)=>v===l.active.volume.values[i]);$('check').textContent=`${equal&&!errors?'PASS':'FAIL'} · native round-trip ${equal} · ${same?'original source exact':'committed source changed'} · ${l.undoCount} undo / ${l.redoCount} redo · shader errors ${errors}`;};
$('grab').onclick=()=>{grip.copy(aim);tool.buttons.trigger={pressed:true,rawValue:1,justPressed:true};move.update(tool,aim,performance.now(),true,grip);tool.buttons.trigger.justPressed=false;};$('pull').onclick=()=>grip.makeTranslation(1.28,.03,1.68);$('long').onclick=()=>grip.makeTranslation(1.6,.05,2.2);$('commit').onclick=()=>{tool.buttons.trigger={pressed:false,rawValue:0,justPressed:false};};$('cancel').onclick=()=>{move.cancel();tool.buttons.trigger={pressed:false,rawValue:0,justPressed:false};grip.copy(aim);};$('undo').onclick=()=>{l.undo();verify();};$('redo').onclick=()=>{l.undo(true);verify();};$('verify').onclick=verify;
let last=0;renderer.setAnimationLoop(time=>{move.update(tool,aim,time,true,grip);renderer.render(scene,camera);if(time-last<120)return;last=time;$('state').textContent=move.feedback;$('grab').disabled=move.active||l.deforming;$('pull').disabled=$('long').disabled=$('commit').disabled=!move.active||l.deforming;$('undo').disabled=move.active||l.deforming||!l.undoCount;$('redo').disabled=move.active||l.deforming||!l.redoCount;$('metrics').textContent=`${move.preview.affectedVertices} affected vertices · ${l.undoCount} undo / ${l.redoCount} redo · ${l.active.volume.dimensions.join('×')} samples · ${l.lastMoveStats?JSON.stringify(l.lastMoveStats):'no committed Move yet'}`;});verify();addEventListener('beforeunload',()=>{move.dispose();l.dispose();baseline.traverse(o=>o.geometry?.dispose());renderer.dispose();});
</script></body></html>
